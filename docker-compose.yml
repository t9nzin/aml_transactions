# Local Airflow (LocalExecutor + Postgres) running the AML pipeline against the repo's DuckDB file.
#   echo "AIRFLOW_UID=$(id -u)" >> .env
#   docker compose up -d --build        # UI on http://localhost:8080 (airflow / airflow)

x-airflow-common: &airflow-common
  build: ./airflow
  image: aml-airflow:local
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AML_PROJECT_DIR: /opt/project
    AML_DUCKDB_PATH: ${AML_DUCKDB_PATH_CONTAINER:-/opt/project/data/warehouse/aml.duckdb}
    DBT_PROFILES_DIR: /opt/project/dbt
    # Docker Desktop's VM is shared with Airflow itself: keep DuckDB well inside it.
    AML_DUCKDB_MEMORY_LIMIT: 2GB
    DBT_THREADS: "1"
  volumes:
    - .:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --role Admin --username airflow --password airflow
                 --firstname aml --lastname admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
