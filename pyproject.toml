[project]
name = "aml-monitoring"
version = "0.1.0"
description = "Anti-money-laundering transaction monitoring on the IBM synthetic AML dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "kaggle>=1.6",
]

[project.optional-dependencies]
snowflake = [
    "dbt-snowflake>=1.8",
    "snowflake-connector-python[pandas]>=3.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbconvert>=7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
